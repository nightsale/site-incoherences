<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Propositions - Accueil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script defer src="js/script.js"></script>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="index.html">Propositions</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">Accueil</a></li>
                <li class="nav-item"><a class="nav-link" href="theme1.html">Thème 1</a></li>
                <li class="nav-item"><a class="nav-link" href="theme2.html">Thème 2</a></li>
                <li class="nav-item"><a class="nav-link" href="theme3.html">Thème 3</a></li>
                <li class="nav-item"><a class="nav-link" href="theme4.html">Thème 4</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h2 class="text-center">Bienvenue sur la plateforme de propositions</h2>
    <p class="text-center">Cliquez sur un thème pour voir les propositions associées.</p>

    <div class="row text-center">
        <div class="col-md-3"><a href="theme1.html" class="btn btn-outline-primary w-100">Thème 1</a></div>
        <div class="col-md-3"><a href="theme2.html" class="btn btn-outline-secondary w-100">Thème 2</a></div>
        <div class="col-md-3"><a href="theme3.html" class="btn btn-outline-success w-100">Thème 3</a></div>
        <div class="col-md-3"><a href="theme4.html" class="btn btn-outline-danger w-100">Thème 4</a></div>
    </div>
</div>

<div class="container mt-4 text-center">
    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#proposalModal">Soumettre une Proposition</button>
</div>

<!-- Modal de soumission -->
<div class="modal fade" id="proposalModal" tabindex="-1" aria-labelledby="proposalModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="proposalModalLabel">Soumettre une Proposition</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="proposalForm">
                    <div class="mb-3">
                        <label for="theme" class="form-label">Choisissez un thème :</label>
                        <select class="form-select" id="theme" required>
                            <option value="">Sélectionnez un thème</option>
                            <option value="theme1">Thème 1</option>
                            <option value="theme2">Thème 2</option>
                            <option value="theme3">Thème 3</option>
                            <option value="theme4">Thème 4</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="text" class="form-label">Votre proposition :</label>
                        <textarea class="form-control" id="text" rows="4" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Soumettre</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
